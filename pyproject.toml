[project]
name = "lms-materials"
version = "0.1.0"
description = ""
authors = [
    {name = "rum",email = "rum@example.com"}
]
requires-python = ">=3.12"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "unidecode (>=1.4.0,<2.0.0)",
    "transliterate (>=1.10.2,<2.0.0)",
    "django-redis (>=7.0.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "black (>=26.10.1,<27.0.0)",
    "ipython (>=9.18.1,<10.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
